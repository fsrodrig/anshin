# Gradle joins this file in the pull request that creates android/.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release waits a week before it is proposed, so a compromised one is usually caught upstream first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        patterns: ["*"]
