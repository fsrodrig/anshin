name: Agent

# Reusable, so a release runs the same checks as a pull request.
on:
  workflow_call:
    inputs:
      cache:
        type: boolean
        default: true

permissions: {}

jobs:
  agent:
    name: Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: go goreleaser
          cache: ${{ inputs.cache }}
      - run: make check-agent
      - run: make check-deploy
