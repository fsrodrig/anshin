name: Agent

# Reusable, so a release runs the same checks as a pull request.
on:
  workflow_call:

permissions: {}

jobs:
  agent:
    name: Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: go
      - run: make check-agent
