name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: make check-repo
      - run: make check-brand

  changes:
    name: Changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      agent: ${{ steps.paths.outputs.agent }}
      android: ${{ steps.paths.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          # Only pull requests are filtered. On main, a run cancelled while pending would leave its diff unchecked,
          # so an empty base makes every component count as changed.
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/changed-components.sh "$BASE" | tee -a "$GITHUB_OUTPUT"

  agent:
    name: Agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    permissions:
      contents: read
    # A local reusable workflow already runs at the caller's commit; actionlint 1.7.12 rejects the newer `$/` form.
    uses: ./.github/workflows/agent.yml # zizmor: ignore[self-repository]

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    permissions:
      contents: read
    # As for agent: a local reusable workflow already runs at the caller's commit.
    uses: ./.github/workflows/android.yml # zizmor: ignore[self-repository]

  # The single required check. It must run even when component jobs are skipped, and it accepts a skip only
  # when the path filter says that component didn't change.
  ci:
    name: CI
    if: always()
    needs: [repo, changes, agent, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          jq -e '
            .repo.result == "success" and .changes.result == "success" and
            (.agent.result == "success" or (.agent.result == "skipped" and .changes.outputs.agent == "false")) and
            (.android.result == "success" or (.android.result == "skipped" and .changes.outputs.android == "false"))
          ' <<< "$NEEDS" > /dev/null
