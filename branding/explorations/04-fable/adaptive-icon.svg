<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 196" width="880" height="392" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">anshin adaptive icon and safe zone</title>
  <desc id="d">Left: the full 108 dp layer with the 72 dp viewport and the 66 dp safe zone drawn over it. Right: the same layers under circle, squircle and rounded-square masks, plus the themed monochrome layer.</desc>
  <defs>
    <g id="fg">
      <g fill="none" stroke-linecap="round">
        <rect x="3.5" y="17.5" width="41" height="13" rx="6.5" stroke-width="3"/>
        <path d="M15 12v24M33 12v24" stroke-width="2"/>
      </g>
      <rect x="18" y="20.75" width="12" height="6.5" rx="3.25" stroke="none"/>
    </g>
    <g id="layers">
      <rect width="108" height="108" fill="#131415"/>
      <use href="#fg" transform="translate(27.6 27.6) scale(1.1)" stroke="#E8D9A6" fill="#E8D9A6"/>
    </g>
    <clipPath id="circle"><circle cx="54" cy="54" r="36"/></clipPath>
    <clipPath id="squircle"><path d="M54 18C26 18 18 26 18 54s8 36 36 36 36-8 36-36-8-36-36-36Z"/></clipPath>
    <clipPath id="rounded"><rect x="18" y="18" width="72" height="72" rx="16"/></clipPath>
  </defs>
  <rect width="440" height="196" fill="#1B1D1F"/>

  <g transform="translate(16 16) scale(1.2)">
    <use href="#layers"/>
    <rect x="0.4" y="0.4" width="107.2" height="107.2" fill="none" stroke="#8D939A" stroke-width="0.8"/>
    <rect x="18" y="18" width="72" height="72" fill="none" stroke="#8D939A" stroke-width="0.8" stroke-dasharray="3 2.5"/>
    <circle cx="54" cy="54" r="33" fill="none" stroke="#5D94DA" stroke-width="0.9" stroke-dasharray="1.5 2.5"/>
  </g>
  <g font-size="9" fill="#8D939A">
    <text x="16" y="160">108 dp layer</text>
    <text x="78" y="160">┄ 72 dp viewport</text>
    <text x="16" y="173" fill="#5D94DA">┈ 66 dp safe zone, mark fully inside</text>
  </g>

  <g transform="translate(176 6) scale(0.9)"><use href="#layers" clip-path="url(#circle)"/></g>
  <g transform="translate(254 6) scale(0.9)"><use href="#layers" clip-path="url(#squircle)"/></g>
  <g transform="translate(332 6) scale(0.9)"><use href="#layers" clip-path="url(#rounded)"/></g>
  <g font-size="9" fill="#8D939A" text-anchor="middle">
    <text x="224.6" y="100">circle</text>
    <text x="302.6" y="100">squircle</text>
    <text x="380.6" y="100">rounded square</text>
  </g>

  <g transform="translate(176 100) scale(0.9)">
    <g clip-path="url(#circle)">
      <rect width="108" height="108" fill="#2A3140"/>
      <use href="#fg" transform="translate(27.6 27.6) scale(1.1)" stroke="#C9D6EE" fill="#C9D6EE"/>
    </g>
  </g>
  <g font-size="8.5" fill="#8D939A">
    <text x="268" y="140">Themed icon: the monochrome</text>
    <text x="268" y="152">layer is the same single-ink mark.</text>
    <text x="268" y="164">Android supplies both tints</text>
    <text x="268" y="176">(example tints shown).</text>
  </g>
</svg>
