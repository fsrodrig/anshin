 "memory", "hex": "#C79BC9"}, {"role": "storage", "hex": "#74BFB0"}, {"role": "network", "hex": "#C4B998"}, {"role": "ok", "hex": "#93C47D"}, {"role": "warn", "hex": "#E8B04C"}, {"role": "crit", "hex": "#EC6A5E"}, {"role": "unavailable", "hex": "#7F8396"}], "board": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>anshin · Level\u003c/title>\n\u003cstyle>\nhtml,body{margin:0;background:transparent}\n.fb3{\n  --bg:#141519;--surface:#1B1C22;--border:#2A2C35;--text:#E8E4DA;--muted:#9A978F;--accent:#A5A8F5;\n  --cpu:#7DB7D6;--mem:#C79BC9;--sto:#74BFB0;--net:#C4B998;\n  --ok:#93C47D;--warn:#E8B04C;--crit:#EC6A5E;--na:#7F8396;--bench:#0C0D10;\n  --ui:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Noto Sans\",sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,\"Roboto Mono\",\"SF Mono\",\"DejaVu Sans Mono\",Menlo,Consolas,monospace;\n  max-width:728px;margin:0 auto;display:grid;gap:10px;\n  font:13px/1.4 var(--ui);color:var(--text);-webkit-font-smoothing:antialiased;text-align:left;\n}\n.fb3 *{box-sizing:border-box}\n.fb3 svg{display:block}\n.fb3 .mono,.fb3 code{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:\"tnum\"}\n.fb3 .panel{background:var(--bg);border-radius:10px;padding:20px}\n.fb3 .bench{background:var(--bench);border-radius:10px;padding:14px 12px}\n.fb3 .eyebrow{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}\n.fb3 .illus{display:inline-block;font:500 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--border);border-radius:3px;padding:3px 5px}\n\n.fb3 .brand{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:center}\n.fb3 .brand h1{font:600 22px/1.15 var(--ui);margin:16px 0 6px;letter-spacing:-.01em}\n.fb3 .brand p{margin:0;color:var(--muted);max-width:44ch}\n.fb3 .brand p b{color:var(--text);font-weight:500}\n.fb3 .build{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;border-left:1px solid var(--border);padding-left:20px}\n.fb3 .build ul{margin:0;padding:0;list-style:none;color:var(--muted);font-size:11.5px;line-height:1.35;display:grid;gap:5px}\n.fb3 .build li b{color:var(--text);font-weight:500}\n.fb3 .legend{grid-column:1/-1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;border-top:1px solid var(--border);padding-top:14px}\n.fb3 .lg{display:grid;gap:4px;justify-items:start}\n.fb3 .lg b{font:500 10.5px/1.2 var(--mono);margin-top:3px}\n.fb3 .lg span{font-size:10px;line-height:1.25;color:var(--muted)}\n\n.fb3 .pal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px 8px}\n.fb3 .sw{display:grid;grid-template-columns:16px minmax(0,1fr);gap:1px 7px;align-items:center}\n.fb3 .sw i{grid-row:1/3;width:16px;height:28px;border-radius:3px;border:1px solid var(--border)}\n.fb3 .sw b{font:500 10.5px/1.2 var(--ui)}\n.fb3 .sw code{font-size:9.5px;line-height:1.2;color:var(--muted)}\n.fb3 .rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px;border-top:1px solid var(--border);padding-top:12px;font-size:11.5px;line-height:1.35;color:var(--muted)}\n.fb3 .rules b{color:var(--text);font-weight:500}\n\n.fb3 .phones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}\n.fb3 figure{margin:0}\n.fb3 figcaption{font:10.5px/1.3 var(--mono);color:var(--muted);padding:8px 4px 0;display:flex;gap:8px;justify-content:space-between;align-items:center}\n.fb3 .phone{background:var(--bg);border:1.5px solid #353741;border-radius:26px;height:744px;overflow:hidden;position:relative;display:flex;flex-direction:column}\n.fb3 .sb{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 18px 0;font:500 11px/1 var(--mono);color:var(--muted)}\n.fb3 .sb span:last-child{display:flex;gap:5px;align-items:center}\n.fb3 .sb i{display:block;width:13px;height:8px;border:1.5px solid var(--muted);border-radius:2px}\n.fb3 .sb u{display:block;width:8px;height:8px;border-radius:50%;background:var(--muted)}\n.fb3 .nav{position:absolute;left:0;right:0;bottom:0;height:20px;background:var(--bg)}\n.fb3 .nav i{position:absolute;left:50%;bottom:8px;width:104px;height:4px;margin-left:-52px;border-radius:2px;background:#4A4C57}\n.fb3 .appbar{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 6px 0 16px}\n.fb3 .appbar .t{font:500 18px/1 var(--ui)}\n.fb3 .appbar .grow{flex:1}\n.fb3 .ib{width:44px;height:44px;display:grid;place-items:center;color:var(--text)}\n.fb3 .appbar.back{padding-left:2px;gap:2px}\n\n.fb3 .topline{flex:none;display:flex;align-items:center;gap:12px;margin:2px 12px 0;padding:10px 4px 12px;border-bottom:1px solid var(--border)}\n.fb3 .topline .w{font:500 17px/1.1 var(--mono);color:var(--warn)}\n.fb3 .topline .w em{font-style:normal;color:var(--text);font-family:var(--ui)}\n.fb3 .topline .r{font-size:12px;color:var(--muted);margin-top:3px}\n.fb3 .topline .n{margin-left:auto;text-align:right;font:11px/1.3 var(--mono);color:var(--muted)}\n\n.fb3 .mcard{flex:none;margin:10px 12px 0;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px 11px}\n.fb3 .mh{display:flex;justify-content:space-between;align-items:flex-start}\n.fb3 .alias{font:600 16px/1.15 var(--ui)}\n.fb3 .live{font:11px/1 var(--mono);color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px}\n.fb3 .live i{width:6px;height:6px;border-radius:50%;background:var(--accent)}\n.fb3 .live b{font-weight:500;color:var(--accent)}\n.fb3 .vd{display:flex;align-items:center;gap:8px;font:500 14px/1 var(--mono)}\n.fb3 .vd.ok{color:var(--ok)} .fb3 .vd.warn{color:var(--warn)} .fb3 .vd.na{color:var(--na)}\n.fb3 .reason{margin-top:9px;padding:6px 8px;border-left:2px solid var(--warn);background:var(--bg);font-size:12.5px;border-radius:0 4px 4px 0}\n.fb3 .reason span{color:var(--muted)}\n.fb3 .mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}\n.fb3 .ml{font:500 10px/1 var(--mono);letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:5px}\n.fb3 .ml i{width:6px;height:6px;border-radius:1px}\n.fb3 .mv{font:500 28px/1 var(--mono);font-variant-numeric:tabular-nums;margin:6px 0 5px;letter-spacing:-.02em}\n.fb3 .mv small{font-size:12px;color:var(--muted);margin-left:3px;letter-spacing:0}\n.fb3 .mv.warn{color:var(--warn)}\n.fb3 .spark{width:100%;height:auto}\n.fb3 .mr{font:10px/1 var(--mono);color:var(--muted);margin-top:5px;white-space:nowrap}\n.fb3 .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 14px;margin-top:11px;padding-top:9px;border-top:1px solid var(--border);font:11px/1.2 var(--mono)}\n.fb3 .kv div{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}\n.fb3 .kv .wide{grid-column:1/-1}\n.fb3 .kv.one{grid-template-columns:minmax(0,1fr)}\n.fb3 .kv span{color:var(--muted)}\n.fb3 .kv .x{color:var(--na)}\n.fb3 .foot{flex:none;margin:auto 12px 28px;text-align:center;font:10px/1.3 var(--mono);color:var(--muted)}\n\n.fb3 .vblock{flex:none;margin:0 16px;padding:4px 0 12px;border-bottom:1px solid var(--border)}\n.fb3 .vrow{display:flex;align-items:center;gap:12px}\n.fb3 .vrow .w{font:500 22px/1 var(--mono);color:var(--warn)}\n.fb3 .vrow .live{margin:0 0 0 auto}\n.fb3 .sec{flex:none;margin:0 16px;padding:11px 0 12px;border-bottom:1px solid var(--border)}\n.fb3 .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}\n.fb3 .sh .ml{font-size:10.5px}\n.fb3 .sh .v{font:500 20px/1 var(--mono);letter-spacing:-.02em}\n.fb3 .sh .v small{font-size:11px;color:var(--muted);margin-left:3px}\n.fb3 .chart{width:100%;height:auto}\n.fb3 .axl{font:8px var(--mono);fill:var(--muted)}\n.fb3 .gapl{font:500 8.5px var(--mono);fill:var(--text)}\n.fb3 .cores{display:flex;gap:4px;align-items:flex-end;margin-top:8px}\n.fb3 .cores i{flex:1;height:22px;background:var(--surface);border-radius:2px;display:flex;align-items:flex-end;overflow:hidden}\n.fb3 .cores u{display:block;width:100%;background:var(--cpu)}\n.fb3 .cores + .mr{margin-top:4px}\n.fb3 .sec .kv{border-top:0;padding-top:0;margin-top:8px}\n.fb3 .fs{display:grid;grid-template-columns:auto 1fr auto;gap:0 10px;align-items:baseline;font:12px/1.2 var(--mono);margin-top:7px}\n.fb3 .fs b{font-weight:500}\n.fb3 .fs span{color:var(--muted);font-size:11px;text-align:right}\n.fb3 .fs .p{font-weight:500;font-size:12px;color:var(--text)}\n.fb3 .fs .p.warn{color:var(--warn)}\n.fb3 .fs svg{grid-column:1/-1;margin-top:3px}\n\n.fb3 .states{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}\n.fb3 .st{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column}\n.fb3 .st .cap{margin-top:auto;padding-top:9px;font-size:11.5px;color:var(--muted)}\n.fb3 .st .cap b{color:var(--text);font-weight:500}\n.fb3 .st .msg{font-size:12.5px;margin-top:8px}\n.fb3 .st .msg span{color:var(--muted)}\n.fb3 .st .mgrid{margin-top:9px}\n.fb3 .st .mv{font-size:22px;color:var(--na)}\n.fb3 .st .mv small{color:var(--na)}\n.fb3 .chip{display:inline-block;font:11px/1 var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:4px 6px;margin:8px 6px 0 0}\n.fb3 .st .kv{grid-template-columns:1fr;border-top:0;padding-top:0;margin-top:6px;gap:6px}\n\n.fb3 .sys{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}\n.fb3 .sizes{display:flex;align-items:center;gap:16px;margin-bottom:12px}\n.fb3 .sizes div{display:grid;gap:5px;justify-items:center;font:9.5px/1 var(--mono);color:var(--muted)}\n.fb3 .sizes .tile{width:44px;height:44px;border-radius:8px;background:var(--surface);border:1px solid var(--border);place-items:center}\n.fb3 .adapt svg{width:100%;height:auto}\n.fb3 .type{display:grid;gap:7px;margin-bottom:14px}\n.fb3 .type div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:baseline}\n.fb3 .type span{font:10px/1.2 var(--mono);color:var(--muted)}\n.fb3 .type .u{font:500 15px/1.2 var(--ui)}\n.fb3 .type .n{font:500 15px/1.2 var(--mono);font-variant-numeric:tabular-nums}\n.fb3 .type .v{font:500 13px/1.2 var(--mono)}\n.fb3 .ths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}\n.fb3 .th{display:flex;align-items:center;gap:7px;border-radius:6px;padding:8px 9px;font-size:11px;border:1px solid var(--border)}\n.fb3 .th i{width:7px;height:7px;border-radius:50%;margin-left:auto}\n.fb3 .th em{font-style:normal;opacity:.75;white-space:nowrap}\n.fb3 .note{font-size:11px;color:var(--muted);margin:8px 0 0}\n\n@media (max-width:640px){\n  .fb3 .brand,.fb3 .sys,.fb3 .phones,.fb3 .states,.fb3 .rules{grid-template-columns:minmax(0,1fr)}\n  .fb3 .build{border-left:0;padding-left:0}\n  .fb3 .legend,.fb3 .pal{grid-template-columns:repeat(4,minmax(0,1fr))}\n  .fb3 figure{max-width:380px;margin:0 auto;width:100%}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"fb3\">\n\n\u003csvg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  \u003cdefs>\n    \u003cpattern id=\"fb3-hatch\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\">\n      \u003crect width=\"5\" height=\"5\" fill=\"#7F8396\" fill-opacity=\".1\"/>\n      \u003cpath d=\"M0 0V5\" stroke=\"#7F8396\" stroke-opacity=\".6\" stroke-width=\"1\"/>\n    \u003c/pattern>\n  \u003c/defs>\n\u003c/svg>\n\n\u003csection class=\"panel brand\">\n  \u003cdiv>\n    \u003csvg viewBox=\"0 4 178 40\" width=\"267.0\" height=\"60\" role=\"img\" aria-label=\"anshin symbol and wordmark\">\u003cg transform=\"translate(-1.83 9) scale(.9167)\">\u003cg fill=\"none\" stroke=\"var(--text)\" stroke-width=\"4\">\u003crect x=\"4\" y=\"14\" width=\"40\" height=\"20\" rx=\"10\"/>\u003cpath d=\"M14 14v20M34 14v20\"/>\u003c/g>\u003ccircle cx=\"24\" cy=\"24\" r=\"5\" fill=\"var(--accent)\"/>\u003c/g>\u003cg transform=\"translate(49 0)\">\u003cg fill=\"none\" stroke=\"var(--text)\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cellipse cx=\"12\" cy=\"31\" rx=\"8\" ry=\"9\"/>\u003cpath d=\"M20 22v18\"/>\u003cpath d=\"M30 40V22M30 30a8 8 0 0 1 16 0v10\"/>\u003cpath d=\"M64 23.92A5.5 4.5 0 1 0 59.5 31A5.5 4.5 0 1 1 55 38.08\"/>\u003cpath d=\"M73 40V8M73 30a8 8 0 0 1 16 0v10\"/>\u003cpath d=\"M99 40V22\"/>\u003cpath d=\"M109 40V22M109 30a8 8 0 0 1 16 0v10\"/>\u003c/g>\u003ccircle cx=\"99\" cy=\"11\" r=\"3.4\" fill=\"var(--accent)\"/>\u003c/g>\u003c/svg>\n    \u003ch1>On the level.\u003c/h1>\n    \u003cp>A level only reads; it never adjusts what it sits on. \u003cb>The mark is a level vial, its bubble at rest between two marks.\u003c/b> The same glyph carries every state in the app: at rest when the Verdict is ok, off the mark when it isn't, hollow or empty when Anshin has nothing current to say.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"build\">\n    \u003csvg class=\"vial \" viewBox=\"0 10 48 28\" width=\"110\" height=\"64.17\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"var(--text)\" stroke-width=\"4\">\u003crect x=\"4\" y=\"14\" width=\"40\" height=\"20\" rx=\"10\"/>\u003cpath d=\"M14 14v20M34 14v20\"/>\u003c/g>\u003ccircle cx=\"24\" cy=\"24\" r=\"5\" fill=\"var(--accent)\"/>\u003c/svg>\n    \u003cul>\n      \u003cli>\u003cb>Two half-discs and a square\u003c/b>, one module.\u003c/li>\n      \u003cli>\u003cb>Square:\u003c/b> the Window.\u003c/li>\n      \u003cli>\u003cb>Dot:\u003c/b> now. Also the dot on the i.\u003c/li>\n      \u003cli>\u003cb>Marks:\u003c/b> limits. In the app, the warn and crit ticks.\u003c/li>\n    \u003c/ul>\n  \u003c/div>\n  \u003cdiv class=\"legend\">\u003cdiv class=\"lg\">\u003csvg class=\"vial \" viewBox=\"0 10 48 28\" width=\"44\" height=\"25.67\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"var(--na)\" stroke-width=\"4\">\u003crect x=\"4\" y=\"14\" width=\"40\" heig " stroke=\"#E8E4DA\"/>\n        \u003ccircle cx=\"24\" cy=\"24\" r=\"5\" fill=\"#A5A8F5\"/>\n      \u003c/g>\n    \u003c/g>\n    \u003crect x=\"-35.5\" y=\"-35.5\" width=\"71\" height=\"71\" rx=\"26.5\" fill=\"none\" stroke=\"#2A2C35\"/>\n  \u003c/g>\n\n  \u003cg transform=\"translate(352 62)\">\n    \u003cg clip-path=\"url(#fb3-rounded)\">\n      \u003crect x=\"-54\" y=\"-54\" width=\"108\" height=\"108\" fill=\"#141519\"/>\n      \u003cg transform=\"translate(-28.8 -28.8) scale(1.2)\">\n        \u003cuse href=\"#fb3-mark\" stroke=\"#E8E4DA\"/>\n        \u003ccircle cx=\"24\" cy=\"24\" r=\"5\" fill=\"#A5A8F5\"/>\n      \u003c/g>\n    \u003c/g>\n    \u003crect x=\"-35.5\" y=\"-35.5\" width=\"71\" height=\"71\" rx=\"14.5\" fill=\"none\" stroke=\"#2A2C35\"/>\n  \u003c/g>\n\n  \u003cg transform=\"translate(438 62)\">\n    \u003cg clip-path=\"url(#fb3-circle)\">\n      \u003crect x=\"-54\" y=\"-54\" width=\"108\" height=\"108\" fill=\"#2B2D3B\"/>\n      \u003cg transform=\"translate(-28.8 -28.8) scale(1.2)\">\n        \u003cuse href=\"#fb3-mark\" stroke=\"#D5D7F4\"/>\n        \u003ccircle cx=\"24\" cy=\"24\" r=\"5\" fill=\"#D5D7F4\"/>\n      \u003c/g>\n    \u003c/g>\n  \u003c/g>\n\n  \u003cg font-family=\"ui-monospace, 'JetBrains Mono', 'Roboto Mono', 'DejaVu Sans Mono', monospace\" font-size=\"8\" fill=\"#9A978F\" text-anchor=\"middle\">\n    \u003ctext x=\"62\" y=\"125\">108 layer · 72 viewport\u003c/text>\n    \u003ctext x=\"62\" y=\"135\" fill=\"#A5A8F5\">66 dp safe zone\u003c/text>\n    \u003ctext x=\"180\" y=\"113\">circle\u003c/text>\n    \u003ctext x=\"266\" y=\"113\">squircle\u003c/text>\n    \u003ctext x=\"352\" y=\"113\">rounded square\u003c/text>\n    \u003ctext x=\"438\" y=\"113\">themed, one colour\u003c/text>\n  \u003c/g>\n\u003c/svg>\n\u003c/div>\n  \u003c/div>\n  \u003cdiv>\n    \u003cp class=\"eyebrow\">Type · system fonts, no shipped UI face\u003c/p>\n    \u003cdiv class=\"type\">\n      \u003cdiv>\u003cspan>UI\u003c/span>\u003cb class=\"u\">Machine B is Unreachable\u003c/b>\u003c/div>\n      \u003cdiv>\u003cspan>numbers\u003c/span>\u003cb class=\"n\">91 %  1.2 MB/s  48 °C\u003c/b>\u003c/div>\n      \u003cdiv>\u003cspan>Verdict\u003c/span>\u003cb class=\"v\">\u003cspan style=\"color:var(--ok)\">ok\u003c/span>  \u003cspan style=\"color:var(--warn)\">warn\u003c/span>  \u003cspan style=\"color:var(--crit)\">crit\u003c/span> \u003cspan style=\"color:var(--muted);font-weight:400\">· the Agent's own words\u003c/span>\u003c/b>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"eyebrow\">Four themes, one identity\u003c/p>\n    \u003cdiv class=\"ths\">\u003cdiv class=\"th\" style=\"background:#1F1F28;color:#DCD7BA\">\u003csvg viewBox=\"0 10 48 28\" width=\"30\" height=\"17.5\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"#DCD7BA\" stroke-width=\"4\">\u003crect x=\"4\" y=\"14\" width=\"40\" height=\"20\" rx=\"10\"/>\u003cpath d=\"M14 14v20M34 14v20\"/>\u003c/g>\u003ccircle cx=\"24\" cy=\"24\" r=\"5\" fill=\"#98BB6C\"/>\u003c/svg>\u003cspan class=\"mono\">ok\u003c/span>\u003ci style=\"background:#7E9CD8\">\u003c/i>\u003cem>Kanagawa\u003c/em>\u003c/div>\u003cdiv class=\"th\" style=\"background:#1A1B26;color:#C0CAF5\">\u003csvg viewBox=\"0 10 48 28\" width=\"30\" height=\"17.5\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"#C0CAF5\" stroke-width=\"4\">\u003crect x=\"4\" y=\"14\" width=\"40\" height=\"20\" rx=\"10\"/>\u003cpath d=\"M14 14v20M34 14v20\"/>\u003c/g>\u003ccircle cx=\"24\" cy=\"24\" r=\"5\" fill=\"#9ECE6A\"/>\u003c/svg>\u003cspan class=\"mono\">ok\u003c/span>\u003ci style=\"background:#7AA2F7\">\u003c/i>\u003cem>Tokyo Night\u003c/em>\u003c/div>\u003cdiv class=\"th\" style=\"background:#1E1E2E;color:#CDD6F4\">\u003csvg viewBox=\"0 10 48 28\" width=\"30\" height=\"17.5\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"#CDD6F4\" stroke-width=\"4\">\u003crect x=\"4\" y=\"14\" width=\"40\" height=\"20\" rx=\"10\"/>\u003cpath d=\"M14 14v20M34 14v20\"/>\u003c/g>\u003ccircle cx=\"24\" cy=\"24\" r=\"5\" fill=\"#A6E3A1\"/>\u003c/svg>\u003cspan class=\"mono\">ok\u003c/span>\u003ci style=\"background:#B4BEFE\">\u003c/i>\u003cem>Catppuccin Mocha\u003c/em>\u003c/div>\u003cdiv class=\"th\" style=\"background:#121212;color:#BEBEBE\">\u003csvg viewBox=\"0 10 48 28\" width=\"30\" height=\"17.5\" aria-hidden=\"true\">\u003cg fill=\"none\" stroke=\"#BEBEBE\" stroke-width=\"4\">\u003crect x=\"4\" y=\"14\" width=\"40\" height=\"20\" rx=\"10\"/>\u003cpath d=\"M14 14v20M34 14v20\"/>\u003c/g>\u003ccircle cx=\"24\" cy=\"24\" r=\"5\" fill=\"#A3B58F\"/>\u003c/svg>\u003cspan class=\"mono\">ok\u003c/span>\u003ci style=\"background:#D9D9D9\">\u003c/i>\u003cem>Matte Black\u003c/em>\u003c/div>\u003c/div>\n    \u003cp class=\"note\">Themes swap the 14 tokens; the vial, the ticks-and-dot grammar, the type and the voice stay. Theme colours here are approximate stand-ins. This page is a design artifact for a native Compose app.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "thumb": "\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=\"utf-8\">\u003cstyle>\nhtml,body{margin:0;background:transparent}\n.fb3{\n  --bg:#141519;--surface:#1B1C22;--border:#2A2C35;--text:#E8E4DA;--muted:#9A978F;--accent:#A5A8F5;\n  --cpu:#7DB7D6;--mem:#C79BC9;--sto:#74BFB0;--net:#C4B998;\n  --ok:#93C47D;--warn:#E8B04C;--crit:#EC6A5E;--na:#7F8396;--bench:#0C0D10;\n  --ui:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Noto Sans\",sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,\"Roboto Mono\",\"SF Mono\",\"DejaVu Sans Mono\",Menlo,Consolas,monospace;\n  max-width:728px;margin:0 auto;display:grid;gap:10px;\n  font:13px/1.4 var(--ui);color:var(--text);-webkit-font-smoothing:antialiased;text-align:left;\n}\n.fb3 *{box-sizing:border-box}\n.fb3 svg{display:block}\n.fb3 .mono,.fb3 code{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:\"tnum\"}\n.fb3 .panel{background:var(--bg);border-radius:10px;padding:20px}\n.fb3 .bench{background:var(--ben Level / ivory", "model": "Fable 5.2 · high", "colors": "Spirit level · graphite · ivory", "description": "An engraved-instrument look with threshold ticks and a quiet warm accent.", "caveat": "The wide mark reads small in a launcher and can resemble a pill.", "palette": [{"role": "background", "hex": "#131415"}, {"role": "surface", "hex": "#1B1D1F"}, {"role": "border", "hex": "#2E3135"}, {"role": "text", "hex": "#D6D9DC"}, {"role": "muted", "hex": "#8D939A"}, {"role": "accent", "hex": "#E8D9A6"}, {"role": "cpu", "hex": "#5D94DA"}, {"role": "memory", "hex": "#935CB2"}, {"role": "storage", "hex": "#29A8AF"}, {"role": "network", "hex": "#B9597D"}, {"role": "ok", "hex": "#66BA7F"}, {"role": "warn", "hex": "#F7AC55"}, {"role": "crit", "hex": "#EF604E"}, {"role": "unavailable", "hex": "#6B7178"}], "board": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>anshin · Level\u003c/title>\n\u003cstyle>\n:root{\n  --bg:#131415; --surface:#1B1D1F; --border:#2E3135; --text:#D6D9DC; --muted:#8D939A; --accent:#E8D9A6;\n  --cpu:#5D94DA; --mem:#935CB2; --sto:#29A8AF; --net:#B9597D;\n  --ok:#66BA7F; --warn:#F7AC55; --crit:#EF604E; --na:#6B7178;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Noto Sans\",sans-serif;\n  --mono:ui-monospace,\"JetBrains Mono\",\"Roboto Mono\",\"DejaVu Sans Mono\",Menlo,Consolas,monospace;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0;background:transparent}\n.board{max-width:728px;margin:0 auto;display:grid;gap:12px;font:13px/1.4 var(--sans);color:var(--text);-webkit-font-smoothing:antialiased}\np,h2,h3,figure{margin:0}\n.panel{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;min-width:0}\n.eyebrow{font:500 10px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}\n.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}\n.muted{color:var(--muted)}\nsvg{display:block}\n\n/* identity */\n.id-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:center}\n.lockup svg{width:100%;max-width:270px;height:auto;color:var(--accent)}\n.tag{font-size:17px;line-height:1.25;margin-top:14px;color:var(--text)}\n.id-copy p{color:var(--muted);margin-top:6px;font-size:12.5px}\n.id-copy p b{color:var(--text);font-weight:500}\n.id-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}\n.cell{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}\n.cell .stage{flex:1;display:flex;align-items:center;justify-content:space-around;gap:6px;min-height:58px}\n.sizes svg{color:var(--text)}\n.light{background:var(--accent);color:var(--bg);border-radius:4px;align-self:stretch;flex:1;display:grid;place-items:center}\n.vlist{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font:10.5px var(--mono);color:var(--text)}\n\n/* vial */\n.vial{width:33px;height:18px;color:var(--muted);flex:none}\n.vial.xl{width:70px;height:38px;color:var(--text)}\n.vial.sm{width:26px;height:14px}\n\n/* phones */\n.phones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}\n.phone{display:flex;flex-direction:column;gap:6px;min-width:0}\n.screen{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}\n.cap{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font:10.5px/1.3 var(--mono);color:var(--muted);display:flex;justify-content:space-between;gap:8px}\n.cap b{font-weight:500;color:var(--accent)}\n.sbar{display:flex;justify-content:space-between;align-items:center;padding:9px 20px 0;font:500 11px var(--mono);color:var(--muted)}\n.sbar span{display:flex;gap:5px;align-items:center}\n.sbar i{display:block;background:var(--muted)}\n.ab \n    \u003c/article>\n  \u003c/div>\n  \u003cp class=\"note\" style=\"padding-top:12px\">Every number on this board is an illustrative mock value, not a measurement or a performance claim. Machine A and Machine B are fictional aliases.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"panel\">\n  \u003cdiv class=\"eyebrow\">Graphite &amp; ivory · semantic dark tokens\u003c/div>\n  \u003cdiv class=\"sw\">\n    \u003cdiv>\u003ci style=\"--c:#131415\">\u003c/i>\u003cb>background\u003c/b>\u003cspan>#131415\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#1B1D1F\">\u003c/i>\u003cb>surface\u003c/b>\u003cspan>#1B1D1F\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#2E3135\">\u003c/i>\u003cb>border\u003c/b>\u003cspan>#2E3135\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#D6D9DC\">\u003c/i>\u003cb>text\u003c/b>\u003cspan>#D6D9DC\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#8D939A\">\u003c/i>\u003cb>muted\u003c/b>\u003cspan>#8D939A\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#E8D9A6\">\u003c/i>\u003cb>accent\u003c/b>\u003cspan>#E8D9A6\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#6B7178\">\u003c/i>\u003cb>unavailable\u003c/b>\u003cspan>#6B7178\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#5D94DA\">\u003c/i>\u003cb>cpu\u003c/b>\u003cspan>#5D94DA\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#935CB2\">\u003c/i>\u003cb>memory\u003c/b>\u003cspan>#935CB2\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#29A8AF\">\u003c/i>\u003cb>storage\u003c/b>\u003cspan>#29A8AF\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#B9597D\">\u003c/i>\u003cb>network\u003c/b>\u003cspan>#B9597D\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#66BA7F\">\u003c/i>\u003cb>ok\u003c/b>\u003cspan>#66BA7F\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#F7AC55\">\u003c/i>\u003cb>warn\u003c/b>\u003cspan>#F7AC55\u003c/span>\u003c/div>\n    \u003cdiv>\u003ci style=\"--c:#EF604E\">\u003c/i>\u003cb>crit\u003c/b>\u003cspan>#EF604E\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"pal2\">\n    \u003cdiv>\n      \u003cdiv class=\"eyebrow\">Type\u003c/div>\n      \u003cdiv class=\"type\">\n        \u003cspan class=\"muted mono\" style=\"font-size:10px\">UI\u003c/span>\u003cspan style=\"font-size:15px\">Machine A · Settings · Add Machine\u003c/span>\n        \u003cspan class=\"muted mono\" style=\"font-size:10px\">NUMBERS\u003c/span>\u003cspan class=\"mono\" style=\"font-size:15px\">12 %  6.4 GiB  48 °C  0.42\u003c/span>\n        \u003cspan class=\"muted mono\" style=\"font-size:10px\">WORDMARK\u003c/span>\u003csvg width=\"74\" height=\"23\" style=\"color:var(--accent)\">\u003cuse href=\"#wm\"/>\u003c/svg>\n      \u003c/div>\n      \u003cp class=\"note\">System sans for UI, JetBrains Mono tabular numerals for numbers, drawn monoline letters for the wordmark. Ivory is brand and interaction only; it never carries a Verdict.\u003c/p>\n    \u003c/div>\n    \u003cdiv>\n      \u003cdiv class=\"eyebrow\">Identity under the four themes\u003c/div>\n      \u003cdiv class=\"themes\">\n        \u003cdiv style=\"background:#1F1F28\">\u003csvg style=\"color:#7E9CD8\">\u003cuse href=\"#mark\"/>\u003c/svg>Kanagawa\u003c/div>\n        \u003cdiv style=\"background:#1A1B26\">\u003csvg style=\"color:#7AA2F7\">\u003cuse href=\"#mark\"/>\u003c/svg>Tokyo Night\u003c/div>\n        \u003cdiv style=\"background:#1E1E2E\">\u003csvg style=\"color:#CBA6F7\">\u003cuse href=\"#mark\"/>\u003c/svg>Catppuccin Mocha\u003c/div>\n        \u003cdiv style=\"background:#121212\">\u003csvg style=\"color:#BEBEBE\">\u003cuse href=\"#mark\"/>\u003c/svg>Matte Black\u003c/div>\n      \u003c/div>\n      \u003cp class=\"note\">The identity is the shape, not a hue. Each theme fills the same 14 tokens and the mark takes its accent. Theme colours here are approximate.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "thumb": "\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=\"utf-8\">\u003cstyle>\n:root{\n  --bg:#131415; --surface:#1B1D1F; --border:#2E3135; --text:#D6D9DC; --muted:#8D939A; --accent:#E8D9A6;\n  --cpu:#5D94DA; --mem:#935CB2; --sto:#29A8AF; --net:#B9597D;\n  --ok:#66BA7F; --warn:#F7AC55; --crit:#EF604E; --na:#6B7178;\n  --sans:system-ui,-apple-system,\"Segoe UI\",Roboto,\"Noto Sans\",sans-serif;\n  --mono:ui-monospace,\"JetBrains Mono\",\"Roboto Mono\",\"DejaVu Sans Mono\",Menlo,Consolas,monospace;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0;background:transparent}\n.board{max-width:728px;margin:0 auto;display:grid;gap:12px;font:13px/1.4 var(--sans);color:var(--text);-webkit-font-smoothing:antialiased}\np,h2,h3,figure{margin:0}\n.panel{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;min-width:0}\n.eyebrow{font:500 10px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}\n.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}\n.muted{color:var(--muted)}\nsvg{display:block}\n\n/* identity */\n.id-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:center}\n.lockup svg{width:100%;max-width:270px;height:auto;color:var(--accent)}\n.tag{font-size:17px;line-height:1.25;margin-top:14px;color:var(--text)}\n.id-copy p{color:var(--muted);margin-top:6px;font-size:12.5px}\n.id-copy p b{color:var(--text);font-weight:500}\n.id-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}\n.cell{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}\n.cell .stage{flex:1;display:flex;align-items:center;justify-content:space-around;gap:6px;min-height:58px}\n.sizes svg{color:var(--text)}\n.light{background:var(--accent);color:var(--bg);border-radius:4px;align-self:stretch;flex:1;display:grid;place-items:center}\n.vlist{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font:10.5px var(--mono);color:var(--text)}\n\n/* vial */\n.vial{width:33px;height:18px;color:var(--muted);flex:none}\n.vial.xl{width:70px;height:38px;color:var(--text)}\n.vial.sm{width:26px;height:14px}\n\n/* phones */\n.phones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}\n.phone{display:flex;flex-direction:column;gap:6px;min-width:0}\n.screen{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}\n.cap{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font:10.5px/1.3 var(--mono);color:var(--muted);display:flex;justify-content:space-between;gap:8px}\n.cap b{font-weight:500;color:var(--accent)}\n.sbar{display:flex;justify-content:space-between;align-items:center;padding:9px 20px 0;font:500 11px var(--mono);color:var(--muted)}\n.sbar span{display:flex;gap:5px;align-items:center}\n.sbar i{display:block;background:var(--muted)}\n.abar{display:flex;align-items:center;gap:6px;height:50px;padding:0 6px 0 16px}\n.abar.back{padding-left:4px}\n.abar h2{font:500 17px/1 var(--sans);flex:1}\n.abar .brand{display:flex;align-items:center;gap:9px;flex:1;color:var(--accent)}\n.abar .brand .wm{color:var(--text)}\n.ib{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);flex:none}\n.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}\n.body{padding:0 12px 10px;display:flex;flex-direction:column;gap:8px;flex:1}\n.gest{height:20px;display:grid;place-items:center}\n.gest i{display:block;width:92px;height:3px;border-radius:2px;background:var(--border)}\n\n.top{padding:6px 4px 12px;border-bottom:1px solid var(--border)}\n.top-row{display:flex;align-items:center;gap:14px;margin:9px 0 9px}\n.vword{font:500 24px/1 var(--mono);letter-spacing:-.01em}\n.reason{font-size:13.5px;margin-top:5px;color:var(--text)}\n.meta{font-size:11px;color:var(--muted)}\n\n.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 12px 12px;min-width:0}\n.card header{display:flex;align-items:center;justify-content:space-between;gap:8px}\n.card h3{font:500 15.5px/1.2 var(--sans)}\n.v{display:flex;align-items:center;gap:7px;font:500 13px var(--mono)}\n.sub{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}\n.why{display:flex;gap:8px;align-items:baseline;margin-top:9px;padding:6px 8px;border:1px solid var(--border);border-left:2px solid var(--warn);border-radius:3px;font-size:12.5px}\n.why .eyebrow{flex:none}\n.rows{display:grid;gap:7px;margin-top:11px}\n.r{display:grid;grid-template-columns:38px 46px minmax(0,1fr);align-items:center;column-gap:10px}\n.k{font:500 10.5px/1 var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}\n.k.path{text-transform:none;letter-spacing:0;font-size:12px;color:var(--text)}\n.n{font:500 14px/1 var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}\n.n i,.big i{font-style:normal;color:var(--muted);font-weight:400;margin-left:3px;font-size:.78em}\n.g{position:relative;height:6px;background:var(--border);border-radius:1px}\n.g>b{position:absolute;left:0;top:0;bottom:0;width:var(--v);background:var(--c);border-radius:1px}\n.g>.t{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted)}\n.g>.t.w{left:90%}.g>.t.c{left:95%}\n.g>.t.hit{background:var(--warn);width:2px}\n.g.na{background:repeating-linear-gradient(135deg,var(--na) 0 1px,transparent 1px 5px);outline:1px solid var(--border)}\n.spark{width:100%;height:20px;overflow:visible}\n.ln{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}\n.ar{stroke:none;opacity:.16}\n.base{stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke}\n.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid var(--border)}\n.kv3 span{display:block;font:500 9.5px/1 var(--mono);letter-spacing:.07em;color:var(--muted)}\n.kv3 b{display:block;font:500 12px/1 var(--mono);font-variant-numeric:tabular-nums;margin-top:5px;white-space:nowrap}\n.kv3 b.na,.nav{color:var(--muted);font-weight:400}\n.foot{margin-top:auto;padding:6px 4px 0;font:10.5px/1.4 var(--mono);color:var(--muted)}\n\n/* detail */\n.vstrip{display:flex;gap:12px;align-items:center;padding:2px 4px 12px}\n.vstrip .vword{font-size:20px}\n.sec{border-top:1px solid var(--border);padding:10px 4px 2px}\n.sec-h{display:flex;align-items:baseline;gap:10px}\n.sec-h .k{width:34px;flex:none}\n.big{font:500 19px/1 var(--mono);font-variant-numeric:tabular-nums}\n.aux{font:11px/1.2 var(--mono);color:var(--muted);margin-left:auto;text-align:right;white-space:nowrap}\n.chart{position:relative;margin-top:9px}\n.chart svg{width:100%;height:64px;overflow:visible}\n.chart.s svg{height:30px}.chart.m svg{height:48px}\n.grid{stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke}\n.yl{position:absolute;left:0;font:9px/1 var(--mono);color:var(--muted);background:var(--bg);padding-right:3px}\n.gapl{position:absolute;left:50%;width:20%;top:3px;text-align:center;font:9.5px/1.25 var(--mono);color:var(--muted)}\n.xax{display:flex;justify-content:space-between;font:9.5px/1 var(--mono);color:var(--muted);margin-top:5px}\n.cores{display:flex;align-items:center;gap:8px;margin-top:9px}\n.cores div{display:flex;gap:2px;flex:1}\n.cores i{position:relative;flex:1;height:16px;background:var(--border);border-radius:1px}\n.cores i::after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:var(--v);background:var(--cpu);border-radius:1px}\n.line{font:11px/1.3 var(--mono);color:var(--muted);margin-top:7px}\n.fs{display:grid;gap:9px;margin-top:9px}\n.fs-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font:11px/1 var(--mono);color:var(--muted)}\n.fs-h b{font   const root = document.getElementById('anshin-brand-comparison');
  const chooser = root.querySelector('.chooser');
  const overview = root.querySelector('.overview-grid');
  const detail = root.querySelector('.detail');
  const full = root.querySelector('.full-board');
  const buttons = new Map();
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let selected = 'overview';
  let frameObserver;

  function resizeFull() {
    const doc = full.contentDocument;
    if (!doc) return;
    full.style.height = Math.ceil(doc.body?.getBoundingClientRect().height || 0) + 2 + 'px';
  }

  full.addEventListener('load', () => {
    frameObserver?.disconnect();
    resizeFull();
    frameObserver = new ResizeObserver(resizeFull);
    if (full.contentDocument?.body) frameObserver.observe(full.contentDocument.body);
  });

  function select(id, persist = true) {
    const item = concepts.find(c => c.id === id);
    selected = item ? id : 'overview';
    for (const [key, button] of buttons) button.setAttribute('aria-pressed', String(key === selected));
    overview.hidden = Boolean(item);
    detail.hidden = !item;
    if (item) {
      detail.querySelector('p').textContent = item.name + ' · ' + item.model + ' · Static design proposal';
      full.title = item.name + ': logo, palette, Dashboard and Machine detail';
      const background = item.palette.find(token => token.role === 'background').hex;
      full.srcdoc = item.board.replace('</head>', `<style>html{background:${background}!important}</style></head>`);
    }
    if (persist && window.openai?.setWidgetState) {
      window.openai.setWidgetState({modelContent:{viewedBrandDirection:selected},privateContent:null}).catch(() => {});
    }
  }

  function addChoice(id, label) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.setAttribute('aria-pressed', 'false');
    button.addEventListener('click', () => select(id));
    chooser.append(button);
    buttons.set(id, button);
  }

  addChoice('overview', 'Compare all');
  for (const c of concepts) {
    addChoice(c.id, c.name);
    const palette = Object.fromEntries(c.palette.map(t => [t.role, t.hex]));
    const article = document.createElement('article');
    article.className = 'direction';
    article.setAttribute('aria-label', c.name + ' by ' + c.model);
    article.innerHTML = `<h2>${esc(c.name)}</h2><p class="model">${esc(c.model)}</p>
      <div class="brand-strip" style="background:${palette.background};color:${palette.text}">${['01-astra','04-fable'].includes(c.id) ? '' : `<div class="symbol-sample">${c.symbol}</div>`}<div class="wordmark-sample">${c.wordmark}</div></div>
      <p class="color-name">${esc(c.colors)}</p>
      <div class="swatches" role="img" aria-label="${esc(c.palette.map(p => p.role+' '+p.hex).join(', '))}">${c.palette.map(p => `<i style="background:${p.hex}" title="${esc(p.role+' '+p.hex)}"></i>`).join('')}</div>
      <p class="description">${esc(c.description)}</p><p class="caveat">${esc(c.caveat)}</p>
      <div class="thumb" aria-label="Dashboard preview"><iframe tabindex="-1" aria-hidden="true" title="${esc(c.name)} Dashboard preview"></iframe></div>
      <button type="button" class="inspect">Inspect ${esc(c.name)}</button>`;
    overview.append(article);
    const viewport = article.querySelector('.thumb');
    const frame = viewport.querySelector('iframe');
    let naturalHeight = 820;
    function fit() {
      const scale = viewport.clientWidth / 350;
      frame.style.transform = `scale(${scale})`;
      viewport.style.height = `${Math.ceil(naturalHeight * scale)}px`;
    }
    frame.addEventListener('load', () => {
      naturalHeight = Math.max(frame.contentDocument.body.scrollHeight, frame.contentDocument.documentElement.scrollHeight);
      frame.style.height = naturalHeight + 'px';
      fit();
    });
    frame.srcdoc = c.thumb;
    new ResizeObserver(fit).observe(viewport);
    article.querySelector('.inspect').addEventListener('click', () => select(c.id));
  }
  root.querySelector('.back').addEventListener('click', () => select('overview'));
  select(window.openai?.widgetState?.modelContent?.viewedBrandDirection || 'overview', false);
  window.addEventListener('openai:set_globals', event => {
    const state = event.detail?.globals?.widgetState;
    if (state) select(state.modelContent?.viewedBrandDirection || 'overview', false);
  });
})();
</script>
