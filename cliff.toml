# git-cliff configuration: https://git-cliff.org/docs/configuration
# Renders CHANGELOG.md in Keep a Changelog 1.1.0 format from Conventional Commits and computes the next SemVer tag.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope and commit.scope != "security" %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/fsrodrig/anshin\
                /compare/{{ release.previous.version }}...{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/fsrodrig/anshin\
                /releases/tag/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/fsrodrig/anshin\
            /compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Merge and subtree-squash commits are not user-facing changes.
filter_unconventional = true
split_commits = false
# The HTML comments only fix the section order; the template strips them.
commit_parsers = [
  { message = "^\\w+\\(security\\)", group = "<!-- 5 -->Security" },
  { message = "^\\w+(\\(.*\\))?!?: deprecate", group = "<!-- 2 -->Deprecated" },
  { message = "^(feat|refactor|perf)(\\(.*\\))?!?: (remove|drop) ", group = "<!-- 3 -->Removed" },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^(perf|revert)", group = "<!-- 1 -->Changed" },
  # Any other breaking change (e.g. `refactor!:`) still belongs in the changelog.
  { message = "^\\w+(\\(.*\\))?!:", group = "<!-- 1 -->Changed" },
  { body = "BREAKING[ -]CHANGE", group = "<!-- 1 -->Changed" },
  { message = ".*", skip = true },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"

[bump]
# Pre-1.0 SemVer: features and breaking changes bump the minor, fixes bump the patch.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
